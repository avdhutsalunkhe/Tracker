<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#0B1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="url(#borderGrad)" stroke-width="8" opacity="0.85" />

  <!-- Target Orbit / Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#1E293B" stroke-width="14" stroke-dasharray="16 12" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#accentGrad)" stroke-width="14" stroke-dasharray="240 800" stroke-linecap="round" />

  <!-- Core Target / Focus Disc -->
  <circle cx="256" cy="256" r="110" fill="#111827" stroke="#334155" stroke-width="4" />

  <!-- Stylized Tracker 'T' + Checkmark + Exam Target -->
  <!-- Checkmark -->
  <path d="M 195 258 L 238 301 L 330 195" fill="none" stroke="url(#checkGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Subtle GATE Milestone Star/Dot at Top -->
  <circle cx="256" cy="116" r="10" fill="#F59E0B" />
  <circle cx="396" cy="256" r="8" fill="#10B981" />
  <circle cx="256" cy="396" r="8" fill="#6366F1" />
</svg>

